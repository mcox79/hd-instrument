[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hd-instrument"
version = "0.1.0.dev0"
description = "Observable hyperdimensional computing substrate with neuromodulator-style control and reward-modulated Hebbian learning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marshall Cox" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "torch-hd>=5.7",
    "duckdb>=0.10",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# BUILD-TIME ONLY (pri 127): nltk is needed to BUILD the frozen lexicon asset
# (tools/build_lexicon_foundation_index.py), never to read. The runtime dependency list above must
# NOT contain it -- verification/test_no_nltk_on_the_live_path.py fails if hdlab/ imports it.
foundation-build = [
    "nltk>=3.9",
]
dashboard = [
    "streamlit>=1.32",
    "plotly>=5.20",
    "networkx>=3.2",
    "pyvis>=0.3",
    "umap-learn>=0.5",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-benchmark>=4",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["hdlab", "reference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["verification"]
python_files = ["test_*.py"]
# pri 128 (notes/problems/447_witness_files_define_no_test_function_.../PROBLEM.md): 465 of the
# 622 verification/test_*.py files defined only a main()/`__main__` block, so pytest collected
# and ran NOTHING from them. Every one now carries a `def test_witness()` tagged fast/corpus/slow.
# Default selection stays FAST (+ any pre-existing untiered test): a plain `pytest verification/`
# must not silently run 5-40-minute corpus reads. `-m fast` / `-m corpus` / `-m slow` /
# `-m "corpus or slow"` select explicitly (CLI -m overrides this addopts -m, it does not add to it).
addopts = ["-p", "verification._witness_manifest", "-m", "not corpus and not slow"]
markers = [
    "fast: quick witness, no corpus/asset I/O -- runs by default",
    "corpus: reads a real corpus/foundation asset -- opt-in via -m corpus",
    "slow: multi-minute witness -- opt-in via -m slow",
]
