# Substrate memory testbed default config.
# Match notes/testbed_architecture_2026-05-29.md "Open decisions" section.

N: 4096
dim: 4096
codebook_kind: bsc
codebook_C: 16384       # = 4 * N (BSC), per architect doc default
codebook_scale: 4
beta: 32.0
hallu_threshold: 0.5

# Scenario shapes
M_total: 10000
edit_isolation_M: 1000
deletion_M: 512
deletion_k_probes: 16
hallu_M_fracs: [0.25, 0.5, 1.0]
hallu_n_oos: 1000
continual_M: 800
storage_latency_Ms: [1000, 5000, 10000]
storage_latency_n_queries: 1000

# Determinism
seeds: [7, 17, 23, 31, 41]

# Matrix
backends: [substrate, faiss, sqlite_vec, dict]
scenarios:
  - point_recall
  - edit_isolation
  - deletion_verify
  - hallu_detect
  - continual_4stage
  - storage_latency

# Output
out_root: testbed_data/benchmarks
