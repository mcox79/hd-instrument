# Tier-4-Llama substrate-attention substitution on Lambda H100.
#
# USER-AUTHORIZED 2026-06-05 (~13:00) per
# exp_dev_to_testbed_tier4_llama1b_cloud_dispatch_2026-06-05: cloud H100
# ($1-3 budget) for the substrate-attention swap test at 1B scale. OOM on
# local 4060 Ti 8GB at fp32; cloud only.
#
# DEFENSES against every prior cloud bug (cornerstone + Llama-1B sessions):
#   Bug 1-4 (capacity): accelerators: H100:1, no region pin, cluster name suffix
#   Bug 5-6 (driver/torch): torch==2.4.1+cu121, transformers>=4.45,<4.50
#   Bug 7 (ghost cluster): HHMMSS cluster name + explicit sky down + verify
#   Bug 9 (fork deadlock): TOKENIZERS_PARALLELISM=false in env + script
#   Bug 10 (silent hangs): PYTHONUNBUFFERED=1 (script has selftests + verbose logs)
#   Bug 11 (HF gated): file-first HF token + HfApi access verify in setup
#   Bug 12 (model load idle): snapshot_download in setup (not idle-counted)
#   Bug 13 (autostop bugs): --down -i 30 + explicit sky down in launcher
#   Bug 14 (rsync race): final rsync in launcher BEFORE sky down
#   Bug 15 (bundle imports): script only uses stdlib + numpy + torch + transformers
#                            + _seed_checkpoint -- no testbed.* or hyperprobe
#   Bug 16 (watchdog mid-write): N/A -- this script has no npz assembly /
#                                  np.savez phase (just write_metrics at end)
#
# Launch:
#   bash /mnt/d/AI/hd-instrument/skypilot/build_tier4_llama_ship.sh
#   bash /mnt/d/AI/hd-instrument/skypilot/launch_tier4_llama.sh

name: tier4llama

resources:
  cloud: lambda
  accelerators: H100:1
  use_spot: false

workdir: .

envs:
  HF_TOKEN: ""

setup: |
  set -e
  export TOKENIZERS_PARALLELISM=false

  echo "=== [setup 1/7] HF_TOKEN sanity ==="
  if [ -z "$HF_TOKEN" ]; then
    echo "ERROR: HF_TOKEN env empty -- did you pass --env HF_TOKEN=...?"
    exit 1
  fi
  echo "HF_TOKEN length: ${#HF_TOKEN} chars; prefix: ${HF_TOKEN:0:5}..."

  echo "=== [setup 2/7] apt deps ==="
  sudo apt-get update -qq 2>&1 | tail -2
  sudo apt-get install -y -qq git rsync curl 2>&1 | tail -2

  echo "=== [setup 3/7] pip core + defensive torch pin (Llama-1B lessons) ==="
  pip install --quiet --upgrade pip
  pip install --quiet --upgrade --force-reinstall \
    "torch==2.4.1" "torchvision==0.19.1" \
    --index-url https://download.pytorch.org/whl/cu121 || \
    pip install --quiet "torch==2.4.1" "torchvision==0.19.1"
  python -c "import torch; print(f'torch {torch.__version__} cuda {torch.version.cuda} driver_ok={torch.cuda.is_available()}')"
  pip install --quiet -r requirements_cloud.txt
  pip install --quiet "transformers>=4.45,<4.50" "huggingface_hub>=0.25" "accelerate>=0.30"

  echo "=== [setup 4/7] HF login ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import login
  login(token=os.environ['HF_TOKEN'], add_to_git_credential=False)
  print('OK: HF login')
  "

  echo "=== [setup 5/7] verify Llama-3.2-1B access (gated repo) ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import HfApi
  info = HfApi().model_info('meta-llama/Llama-3.2-1B', token=os.environ['HF_TOKEN'])
  print(f'OK: meta-llama/Llama-3.2-1B accessible (last_modified={info.last_modified})')
  "

  echo "=== [setup 6/7] pre-pull Llama-3.2-1B snapshot (NOT counted as idle) ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import snapshot_download
  snapshot_download(
      repo_id='meta-llama/Llama-3.2-1B',
      token=os.environ['HF_TOKEN'],
      cache_dir=os.environ.get('HF_HOME', os.path.expanduser('~/.cache/huggingface')),
      allow_patterns=['*.safetensors', '*.json', 'tokenizer*', '*.model'],
  )
  print('OK: Llama-3.2-1B snapshot ready')
  "

  echo "=== [setup 7/7] script --self-test gate (PROT-022 substrate-attn selftests) ==="
  cd ~/sky_workdir
  python -u experiments/exp_substrate_tier4_hopfield_attention_substitution_llama_3_2_1b_v1.py --self-test

  echo "=== setup complete; environment ready ==="

run: |
  export TOKENIZERS_PARALLELISM=false
  export PYTHONUNBUFFERED=1
  export HDLAB_RUN_MODE=full
  export HF_TOKEN="$HF_TOKEN"
  export HDLAB_EXP_NAME=substrate_tier4_hopfield_attention_substitution_llama_3_2_1b_v1
  cd ~/sky_workdir

  echo "=== Tier-4-Llama substrate-attention substitution START ==="
  python -u experiments/exp_substrate_tier4_hopfield_attention_substitution_llama_3_2_1b_v1.py

  echo "=== run complete; artifacts: ==="
  ls -la ~/sky_workdir/data/exp_substrate_tier4_hopfield_attention_substitution_llama_3_2_1b_v1/ 2>&1 | head -25
