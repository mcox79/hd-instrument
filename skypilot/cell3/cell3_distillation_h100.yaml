# CELL-3 distilled 22M student on Lambda H100:1 or GH200:1.
#
# Pipeline:
#   1. Setup: install torch (cu121 if H100 x86; cu128 if GH200 aarch64), HF login,
#      verify Llama-3.2-1B access, pre-download Wikipedia parquets (~11.6 GB),
#      pre-download Llama-3.2-1B snapshot (~2.5 GB), upload CELL-2 v3 cache shards.
#   2. PROT-022 self-test gate.
#   3. Run training script.
# Cost: ~$0.30-1.50 depending on scope (1M smoke vs full 5.84M) and SKU.

name: cell3fd

resources:
  cloud: lambda
  use_spot: false
  # SKU + accelerators come from CLI --instance-type passed by safety stack.
  # any_of removed: SkyPilot validates each any_of against CLI overrides and
  # fails when any entry mismatches the CLI's accelerator type (2026-06-07 bug).

workdir: .

envs:
  HF_TOKEN: ""
  CELL3_MAX_ARTICLES: ""

setup: |
  set -e
  export TOKENIZERS_PARALLELISM=false

  echo "=== [setup 1/8] HF_TOKEN sanity ==="
  if [ -z "$HF_TOKEN" ]; then
    echo "ERROR: HF_TOKEN env empty"
    exit 1
  fi
  echo "HF_TOKEN length: ${#HF_TOKEN} chars; prefix: ${HF_TOKEN:0:5}..."

  echo "=== [setup 2/8] detect GPU + arch + apt deps ==="
  sudo apt-get update -qq 2>&1 | tail -2
  sudo apt-get install -y -qq git rsync curl 2>&1 | tail -2
  nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv
  ARCH=$(uname -m)
  GPU_NAME=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1)
  echo "Detected ARCH=${ARCH} GPU=${GPU_NAME}"

  echo "=== [setup 3/8] install torch (cu121 for x86 H100, cu128 for aarch64 GH200) ==="
  pip install --quiet --upgrade pip
  if [ "$ARCH" = "aarch64" ]; then
    echo "Installing cu128 wheel for GH200"
    pip install --quiet --upgrade "torch>=2.5" "torchvision>=0.20" \
      --index-url https://download.pytorch.org/whl/cu128 || \
    pip install --quiet --upgrade "torch" "torchvision" \
      --index-url https://download.pytorch.org/whl/nightly/cu128
  else
    echo "Installing cu121 wheel for x86 H100"
    pip install --quiet --upgrade "torch>=2.5" "torchvision>=0.20" \
      --index-url https://download.pytorch.org/whl/cu121
  fi
  python -c "
  import torch
  print(f'torch {torch.__version__} cuda {torch.version.cuda} ok={torch.cuda.is_available()}')
  props = torch.cuda.get_device_properties(0)
  print(f'device: {props.name} VRAM={props.total_memory/1e9:.1f}GB')
  "
  pip install --quiet -r requirements_cloud.txt
  pip install --quiet "transformers>=4.45,<4.50" "huggingface_hub>=0.25" "accelerate>=0.30" "datasets>=2.20" "pyarrow"

  echo "=== [setup 4/8] HF login ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import login
  login(token=os.environ['HF_TOKEN'], add_to_git_credential=False)
  print('OK: HF login')
  "

  echo "=== [setup 5/8] verify Llama-3.2-1B Base access ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import HfApi
  info = HfApi().model_info('meta-llama/Llama-3.2-1B', token=os.environ['HF_TOKEN'])
  print(f'OK: meta-llama/Llama-3.2-1B accessible (last_modified={info.last_modified})')
  "

  echo "=== [setup 6/8] pre-pull Llama-3.2-1B snapshot (~2.5 GB) ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import snapshot_download
  snapshot_download(
      repo_id='meta-llama/Llama-3.2-1B',
      token=os.environ['HF_TOKEN'],
      allow_patterns=['*.safetensors', '*.bin', '*.json', 'tokenizer*', '*.model', '*.txt'],
  )
  print('OK: Llama-3.2-1B snapshot ready')
  "

  echo "=== [setup 7/8] pre-download Wikipedia parquet shards (~11.6 GB; for raw text lookup) ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import snapshot_download
  path = snapshot_download(
      repo_id='wikimedia/wikipedia', repo_type='dataset',
      token=os.environ['HF_TOKEN'],
      allow_patterns=['20231101.en/*.parquet'],
  )
  print(f'OK: Wikipedia parquets at {path}')
  "

  echo "=== [setup 8/8] CELL-3 script --self-test gate (PROT-022) ==="
  cd ~/sky_workdir
  python -u experiments/exp_substrate_cell3_distilled_22M_student_v1.py --self-test

  echo "=== verifying CELL-2 v3 cache shards present in bundle ==="
  ls ~/sky_workdir/data/cell2_results/shard_*.npz 2>/dev/null | wc -l
  du -sh ~/sky_workdir/data/cell2_results/ 2>&1 | head -1

  echo "=== setup complete; environment ready ==="

run: |
  export TOKENIZERS_PARALLELISM=false
  export PYTHONUNBUFFERED=1
  export HDLAB_RUN_MODE=full
  export HF_TOKEN="$HF_TOKEN"
  export HDLAB_EXP_NAME=substrate_cell3_distilled_22M_student_v1
  cd ~/sky_workdir

  echo "=== CELL-3 distilled 22M student training START ==="

  # Optional scope override via env (1M smoke vs full 5.84M)
  EXTRA_ARGS=""
  if [ -n "${CELL3_MAX_ARTICLES:-}" ]; then
    EXTRA_ARGS="--max-articles ${CELL3_MAX_ARTICLES}"
    echo "Scope override: --max-articles ${CELL3_MAX_ARTICLES}"
  fi

  # Enable torch.compile by default on cloud H100/GH200 (stable shapes after fix)
  python -u experiments/exp_substrate_cell3_distilled_22M_student_v1.py \
    --cell2-shards-dir ~/sky_workdir/data/cell2_results \
    --compile \
    $EXTRA_ARGS

  echo "=== run complete; artifacts: ==="
  ls -la ~/sky_workdir/data/exp_substrate_cell3_distilled_22M_student_v1/ 2>&1 | head -20
  cat ~/sky_workdir/data/exp_substrate_cell3_distilled_22M_student_v1/metrics.json 2>&1 | python3 -m json.tool | head -40
