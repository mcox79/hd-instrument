# CLOUD-1 substrate-extraction-quality 8B vs 70B binding test on Lambda H100:1.
#
# USER-AUTHORIZED 2026-06-06 per research_to_testbed_cloud_experiments_list_when_authorized
#   (CLOUD-1; TOP PRIORITY; ~$0.50-1.00; ~15-20 min wall; binds extraction-infra
#   decisions for $31 CPU fleet vs $1 Mac fleet vs continued cloud baseline).
#
# DEFENSES against every prior cloud bug (cornerstone + Llama-1B + Tier-4-Llama):
#   Bug 1-4 (capacity)     : accelerators: H100:1, no region pin, retry-until-up
#   Bug 5-6 (driver/torch) : torch==2.4.1+cu121, transformers>=4.45,<4.50
#   Bug 7 (ghost cluster)  : HHMMSS cluster name + explicit sky down + verify
#   Bug 8 (autostop bugs)  : --down -i 30 + explicit sky down in launcher
#   Bug 9 (fork deadlock)  : TOKENIZERS_PARALLELISM=false in env + script
#   Bug 10 (silent hangs)  : PYTHONUNBUFFERED=1 + python -u; verbose setup
#   Bug 11 (HF gated)      : file-first HF token + HfApi access verify in setup
#   Bug 12 (model load idle): snapshot_download in SETUP (not counted as idle)
#   Bug 13 (4bit quant)    : bitsandbytes installed in setup for 70B NF4 path
#   Bug 14 (rsync race)    : final rsync in launcher BEFORE sky down
#   Bug 15 (bundle imports): script uses stdlib + numpy + torch + transformers
#                             + bitsandbytes + datasets + _seed_checkpoint only
#   Bug 16 (watchdog mid-write): N/A -- this script writes only metrics.json
#                                  (no np.savez assembly phase)
#
# 70B fits on a single H100 80GB at NF4 (~38GB weights + KV cache headroom);
# 8B fp16 fits comfortably (~16GB). Sequential load -> no co-resident pressure.
#
# Launch:
#   bash /mnt/d/AI/hd-instrument/skypilot/build_cloud_1_ship.sh
#   bash /mnt/d/AI/hd-instrument/skypilot/launch_cloud_1.sh

name: cloud1quality

resources:
  cloud: lambda
  accelerators: H100:1
  use_spot: false
  # Per [[feedback-cloud-location-doesnt-matter]] (2026-06-04 cornerstone catch)
  # AMPLIFIED 2026-06-06: the original fix listed regions only. But observed
  # behavior on 2026-06-06: with `accelerators: H100:1`, SkyPilot's optimizer
  # picked the CHEAPEST SKU (gpu_1x_h100_pcie at $3.29/h) and locked the cluster
  # spec to that SKU. On capacity-miss it cycled the 5 regions but never tried
  # the SXM5 SKU even when SXM5 was available in us-south-2. So we now any_of
  # BOTH (instance_type, region) combinations -- 5 regions x 2 SKUs = 10 candidates.
  # Optimizer still ranks by cost (PCIe cheaper) but capacity-miss falls back to
  # SXM5 instead of giving up the H100 family.
  any_of:
    - {instance_type: gpu_1x_h100_pcie, region: us-east-1}
    - {instance_type: gpu_1x_h100_pcie, region: us-east-3}
    - {instance_type: gpu_1x_h100_pcie, region: us-south-2}
    - {instance_type: gpu_1x_h100_pcie, region: us-west-1}
    - {instance_type: gpu_1x_h100_pcie, region: us-west-3}
    - {instance_type: gpu_1x_h100_sxm5, region: us-east-1}
    - {instance_type: gpu_1x_h100_sxm5, region: us-east-3}
    - {instance_type: gpu_1x_h100_sxm5, region: us-south-2}
    - {instance_type: gpu_1x_h100_sxm5, region: us-west-1}
    - {instance_type: gpu_1x_h100_sxm5, region: us-west-3}

workdir: .

envs:
  HF_TOKEN: ""

setup: |
  set -e
  export TOKENIZERS_PARALLELISM=false

  echo "=== [setup 1/8] HF_TOKEN sanity ==="
  if [ -z "$HF_TOKEN" ]; then
    echo "ERROR: HF_TOKEN env empty -- did you pass --env HF_TOKEN=...?"
    exit 1
  fi
  echo "HF_TOKEN length: ${#HF_TOKEN} chars; prefix: ${HF_TOKEN:0:5}..."

  echo "=== [setup 2/8] apt deps ==="
  sudo apt-get update -qq 2>&1 | tail -2
  sudo apt-get install -y -qq git rsync curl 2>&1 | tail -2

  echo "=== [setup 3/8] pip core + defensive torch pin (Llama-1B + Tier-4 lessons) ==="
  pip install --quiet --upgrade pip
  pip install --quiet --upgrade --force-reinstall \
    "torch==2.4.1" "torchvision==0.19.1" \
    --index-url https://download.pytorch.org/whl/cu121 || \
    pip install --quiet "torch==2.4.1" "torchvision==0.19.1"
  python -c "import torch; print(f'torch {torch.__version__} cuda {torch.version.cuda} driver_ok={torch.cuda.is_available()}')"
  pip install --quiet -r requirements_cloud.txt
  pip install --quiet "transformers>=4.45,<4.50" "huggingface_hub>=0.25" "accelerate>=0.30" "datasets>=2.20" "bitsandbytes>=0.43"

  echo "=== [setup 4/8] HF login ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import login
  login(token=os.environ['HF_TOKEN'], add_to_git_credential=False)
  print('OK: HF login')
  "

  echo "=== [setup 5/8] verify Llama-3.1-8B + Llama-3.1-70B access (gated repos) ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import HfApi
  api = HfApi()
  for repo in ['meta-llama/Llama-3.1-8B', 'meta-llama/Llama-3.1-70B']:
      info = api.model_info(repo, token=os.environ['HF_TOKEN'])
      print(f'OK: {repo} accessible (last_modified={info.last_modified})')
  "

  echo "=== [setup 6/8] pre-pull Llama-3.1-8B snapshot ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import snapshot_download
  snapshot_download(
      repo_id='meta-llama/Llama-3.1-8B',
      token=os.environ['HF_TOKEN'],
      cache_dir=os.environ.get('HF_HOME', os.path.expanduser('~/.cache/huggingface')),
      allow_patterns=['*.safetensors', '*.json', 'tokenizer*', '*.model'],
  )
  print('OK: Llama-3.1-8B snapshot ready')
  "

  echo "=== [setup 7/8] pre-pull Llama-3.1-70B snapshot (big: ~140GB at fp16 weights) ==="
  python -c "
  import os
  os.environ['TOKENIZERS_PARALLELISM'] = 'false'
  from huggingface_hub import snapshot_download
  snapshot_download(
      repo_id='meta-llama/Llama-3.1-70B',
      token=os.environ['HF_TOKEN'],
      cache_dir=os.environ.get('HF_HOME', os.path.expanduser('~/.cache/huggingface')),
      allow_patterns=['*.safetensors', '*.json', 'tokenizer*', '*.model'],
  )
  print('OK: Llama-3.1-70B snapshot ready')
  "

  echo "=== [setup 8/8] script --self-test gate (PROT-022) ==="
  cd ~/sky_workdir
  python -u experiments/exp_substrate_extraction_quality_7B_vs_70B_v1.py --self-test

  echo "=== setup complete; environment ready ==="

run: |
  export TOKENIZERS_PARALLELISM=false
  export PYTHONUNBUFFERED=1
  export HDLAB_RUN_MODE=full
  export HF_TOKEN="$HF_TOKEN"
  export HDLAB_EXP_NAME=substrate_extraction_quality_7B_vs_70B_v1
  cd ~/sky_workdir

  echo "=== CLOUD-1 8B vs 70B substrate-extraction-quality binding test START ==="
  python -u experiments/exp_substrate_extraction_quality_7B_vs_70B_v1.py

  echo "=== run complete; artifacts: ==="
  ls -la ~/sky_workdir/data/exp_substrate_extraction_quality_7B_vs_70B_v1/ 2>&1 | head -25
